<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elizabeth Strain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400;1,500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5F1E8;
    --linen-blue: #A9BCD0;
    --cornflower: #7B93B0;
    --gold: #B8955F;
    --ink: #2B2925;
    --ink-soft: #55524B;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background-color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    color: var(--ink);
    overflow: hidden;
  }

  .stage {
    position: relative;
    height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Faded linen texture, cornflower blue, breathing gently */
  .linen {
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(90deg, rgba(123,147,176,0.05) 0px, rgba(123,147,176,0.05) 1px, transparent 1px, transparent 3px),
      repeating-linear-gradient(0deg, rgba(123,147,176,0.05) 0px, rgba(123,147,176,0.05) 1px, transparent 1px, transparent 3px),
      radial-gradient(ellipse at 50% 40%, rgba(169,188,208,0.35) 0%, rgba(169,188,208,0.12) 45%, rgba(245,241,232,0) 75%);
    animation: breathe 14s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.85; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.015); }
  }

  .content {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 0 24px;
    max-width: 640px;
  }

  .eyebrow {
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--cornflower);
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.2s;
  }

  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: clamp(42px, 7vw, 76px);
    letter-spacing: 0.06em;
    color: var(--ink);
    opacity: 0;
    animation: fadeUp 1.1s ease forwards 0.45s;
  }

  .rule {
    width: 56px;
    height: 1px;
    background: var(--gold);
    margin: 30px auto;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.75s;
  }

  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(16px, 2vw, 20px);
    color: var(--ink-soft);
    letter-spacing: 0.01em;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.95s;
  }

  .status {
    margin-top: 56px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
    opacity: 0;
    animation: fadeUp 1s ease forwards 1.2s;
  }

  .status a {
    color: var(--gold);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    transition: border-color 0.3s ease;
  }

  .status a:hover {
    border-color: var(--gold);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .linen { animation: none; }
    .eyebrow, h1, .rule, .tagline, .status { animation: none; opacity: 1; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="linen"></div>
  <div class="content">
    <div class="eyebrow">Brand Strategy &amp; PR</div>
    <h1>Elizabeth Strain</h1>
    <div class="rule"></div>
    <p class="tagline">for the love of things done well.</p>
    <p class="status">The full site is being built with the same care.<br>In the meantime, reach me at <a href="mailto:hello@elizabethstrain.com">hello@elizabethstrain.com</a></p>
  </div>
</div>

</body>
</html>
