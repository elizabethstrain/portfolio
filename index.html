<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elizabeth Strain</title>
  <meta name="description" content="for the love of things done well.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png">

  <!-- Open Graph -->
  <meta property="og:title" content="Elizabeth Strain">
  <meta property="og:description" content="for the love of things done well.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://elizabethstrain.com/">
  <meta property="og:image" content="https://elizabethstrain.com/images/Tezza-3729.jpeg">
  <meta property="og:site_name" content="Elizabeth Strain">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Elizabeth Strain">
  <meta name="twitter:description" content="for the love of things done well.">
  <meta name="twitter:image" content="https://elizabethstrain.com/images/Tezza-3729.jpeg">
  
  <!-- Typography Imports -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:ital,wght@0,300;1,300&family=Pinyon+Script&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-blue-linen: #8FA3B8;
      --color-cool-cream: #F5F2EF;
      --color-near-black: #1C1917;
      --color-taupe: #A89D8F;
      --color-gold: #8B6914;
      --color-cornflower: #8B9FBB;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-script: 'Pinyon Script', cursive;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--color-blue-linen);
      color: var(--color-cool-cream);
      font-family: var(--font-sans);
      font-weight: 300;
      overflow: hidden;
    }

    body {
      opacity: 0;
      transition: opacity 300ms ease;
    }

    body.page-loaded {
      opacity: 1;
    }

    body.page-fading {
      opacity: 0;
    }

    /* Custom Cursor */
    @media (hover: hover) and (pointer: fine) {
      * {
        cursor: none !important;
      }
    }

    .custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--color-cool-cream, #F5F2EF);
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 0, 0, 0.15);
      border-radius: 50%;
      pointer-events: none !important;
      z-index: 999999;
      opacity: 0;
      transform: translate(-50%, -50%);
      transition: width 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                  height 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-color 0.2s ease,
                  box-shadow 0.2s ease,
                  opacity 0.2s ease;
      will-change: transform;
    }

    .custom-cursor.cursor-visible {
      opacity: 1;
    }

    .custom-cursor.cursor-active {
      width: 24px;
      height: 24px;
      border-color: var(--color-gold, #8B6914);
    }

    .custom-cursor.cursor-down {
      width: 8px;
      height: 8px;
    }

    .custom-cursor.cursor-light {
      border-color: var(--color-cool-cream, #F5F2EF) !important;
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 0, 0, 0.25);
    }

    /* "Elizabeth Strain" top left */
    .brand-logo {
      position: fixed;
      top: 28px;
      left: 48px;
      font-family: var(--font-serif);
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(247, 244, 240, 0.85);
      text-decoration: none;
      transition: color 200ms ease;
      z-index: 50;
    }

    .brand-logo:hover {
      color: var(--color-gold);
    }

    .hamburger {
      position: fixed;
      top: 28px;
      right: 48px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px;
      width: 30px;
      height: 30px;
      pointer-events: auto;
    }

    .hamburger span {
      display: block;
      width: 22px;
      height: 1.5px;
      background: #FFFFFF;
      mix-blend-mode: difference;
      transition: all 300ms cubic-bezier(0.23, 1, 0.32, 1);
      transform-origin: center;
    }

    .hamburger.active span:nth-child(1) {
      transform: translateY(7.5px) rotate(45deg);
      background: var(--color-gold);
      mix-blend-mode: normal;
    }

    .hamburger.active span:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }

    .hamburger.active span:nth-child(3) {
      transform: translateY(-7.5px) rotate(-45deg);
      background: var(--color-gold);
      mix-blend-mode: normal;
    }

    /* Hero Section */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: #8FA3B8;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.08;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='f'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9 0.15' numOctaves='3' seed='5' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23f)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='4' seed='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .hero-word-wrap {
      position: absolute;
      z-index: 2;
      animation: fadeRise 900ms cubic-bezier(0.25, 0.1, 0.25, 1) both;
    }

    .hero-word-wrap:nth-child(1) { animation-delay: 0ms; }
    .hero-word-wrap:nth-child(2) { animation-delay: 200ms; }
    .hero-word-wrap:nth-child(3) { animation-delay: 400ms; }
    .hero-word-wrap:nth-child(4) { animation-delay: 600ms; }

    .hero-word {
      display: block;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 400;
      color: rgba(247, 244, 240, 0.88);
      line-height: 1;
      cursor: default;
      user-select: none;
      white-space: nowrap;
      will-change: transform;
      transition: transform 800ms cubic-bezier(0.23, 1, 0.32, 1);
    }

    .hero-word:hover {
      transform: translateY(-6px);
    }

    @keyframes fadeRise {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Scroll indicator */
    .scroll-indicator {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      width: 1px;
      height: 28px;
      background-color: rgba(247, 244, 240, 0.3);
      animation: scrollPulse 3s ease-in-out infinite;
      z-index: 20;
      pointer-events: none;
    }

    @keyframes scrollPulse {
      0%, 100% {
        opacity: 0.15;
        transform: translateX(-50%) scaleY(0.7);
      }
      50% {
        opacity: 0.6;
        transform: translateX(-50%) scaleY(1);
      }
    }

    /* Navigation Overlay */
    .nav-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: var(--color-cool-cream);
      z-index: 300;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 350ms cubic-bezier(0.16, 1, 0.3, 1), visibility 350ms;
    }

    .nav-overlay.open,
    .nav-overlay.is-active {
      opacity: 1;
      visibility: visible;
    }

    .nav-links-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      list-style: none;
      z-index: 310;
      text-align: center;
    }

    .nav-link-item a {
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: 2.8rem;
      color: var(--color-near-black);
      text-decoration: none;
      transition: color 200ms ease;
      display: inline-block;
    }

    .nav-link-item a:hover {
      color: var(--color-gold);
    }

    .nav-signature {
      position: absolute;
      bottom: 48px;
      right: 56px;
      font-family: var(--font-script);
      font-size: 2.2rem;
      color: var(--color-gold);
      user-select: none;
      z-index: 310;
    }

    @media (max-width: 768px) {
      .brand-logo {
        top: 24px;
        left: 24px;
      }
      .hamburger {
        top: 24px;
        right: 24px;
      }
      .nav-link-item a {
        font-size: 2.2rem;
      }
      .nav-signature {
        bottom: 32px;
        right: 28px;
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <a href="index.html" class="brand-logo" id="brand-logo">Elizabeth Strain</a>
  <button type="button" class="hamburger" id="menu-open-btn" aria-label="Toggle Navigation">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <!-- Cascading Hero Section -->
  <section class="hero" id="hero-stage">
    <div class="hero-word-wrap" style="top: 20%; left: 30%;">
      <span class="hero-word" id="hero-word-1" style="font-size: clamp(3rem,6vw,5.5rem);">for the</span>
    </div>
    <div class="hero-word-wrap" style="top: 34%; left: 38%;">
      <span class="hero-word" id="hero-word-2" style="font-size: clamp(4.5rem,9vw,8.5rem);">love of</span>
    </div>
    <div class="hero-word-wrap" style="top: 50%; left: 28%;">
      <span class="hero-word" id="hero-word-3" style="font-size: clamp(5.5rem,11vw,10rem);">things</span>
    </div>
    <div class="hero-word-wrap" style="top: 65%; left: 52%;">
      <span class="hero-word" id="hero-word-4" style="font-size: clamp(3.5rem,7vw,6.5rem);">done well.</span>
    </div>
  </section>

  <!-- Scroll Indicator -->
  <div class="scroll-indicator" aria-hidden="true" id="scroll-indicator"></div>

  <!-- Fullscreen Paper Navigation Overlay -->
  <div class="nav-overlay" id="navOverlay" aria-hidden="true">
    <ul class="nav-links-list" id="nav-links">
      <li class="nav-link-item"><a href="about.html" id="link-about">About Elizabeth</a></li>
      <li class="nav-link-item"><a href="projects.html" id="link-projects">Selected Projects</a></li>
      <li class="nav-link-item"><a href="thinking.html" id="link-thinking">Thinking & POV</a></li>
      <li class="nav-link-item"><a href="contact.html" id="link-contact">Contact</a></li>
    </ul>
    <div class="nav-signature" id="nav-signature">Elizabeth Strain</div>
  </div>

  <script>
    // Page load & smooth page transitions
    document.addEventListener('DOMContentLoaded', () => {
      requestAnimationFrame(() => {
        document.body.classList.add('page-loaded');
      });

      document.querySelectorAll('a').forEach(link => {
        const href = link.getAttribute('href');
        if (href && !href.startsWith('#') && !href.startsWith('mailto:') && !href.startsWith('tel:') && !href.startsWith('javascript:') && !link.hasAttribute('target')) {
          link.addEventListener('click', (e) => {
            e.preventDefault();
            document.body.classList.remove('page-loaded');
            document.body.classList.add('page-fading');
            setTimeout(() => {
              window.location.href = href;
            }, 300);
          });
        }
      });
    });

    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        document.body.classList.remove('page-fading');
        document.body.classList.add('page-loaded');
      }
    });

    // Navigation Overlay Logic
    const hamburger = document.querySelector('.hamburger');
    const navOverlay = document.getElementById('navOverlay') || document.getElementById('nav-overlay');

    function openNav() {
      if (navOverlay) {
        navOverlay.classList.add('open');
        navOverlay.classList.add('is-active');
        navOverlay.setAttribute('aria-hidden', 'false');
      }
      if (hamburger) hamburger.classList.add('active');
    }

    function closeNav() {
      if (navOverlay) {
        navOverlay.classList.remove('open');
        navOverlay.classList.remove('is-active');
        navOverlay.setAttribute('aria-hidden', 'true');
      }
      if (hamburger) hamburger.classList.remove('active');
    }

    if (hamburger) {
      hamburger.addEventListener('click', () => {
        if (hamburger.classList.contains('active')) {
          closeNav();
        } else {
          openNav();
        }
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && navOverlay && (navOverlay.classList.contains('open') || navOverlay.classList.contains('is-active'))) {
        closeNav();
      }
    });

    // Custom Cursor tracking
    (function() {
      if (window.matchMedia('(hover: none)').matches) return;
      const cursor = document.createElement('div');
      cursor.id = 'cursor';
      cursor.className = 'custom-cursor';
      document.body.appendChild(cursor);

      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      let cursorX = mouseX;
      let cursorY = mouseY;
      let hasMoved = false;

      window.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        if (!hasMoved) {
          hasMoved = true;
          cursorX = mouseX;
          cursorY = mouseY;
          cursor.classList.add('cursor-visible');
        }
      });

      document.addEventListener('mouseenter', () => {
        if (hasMoved) cursor.classList.add('cursor-visible');
      });

      document.addEventListener('mouseleave', () => {
        cursor.classList.remove('cursor-visible');
      });

      window.addEventListener('mousedown', () => {
        cursor.classList.add('cursor-down');
      });

      window.addEventListener('mouseup', () => {
        cursor.classList.remove('cursor-down');
      });

      function bindCursorHovers() {
        const interactives = document.querySelectorAll('a, button, [role="button"], input, textarea, .nav-item');
        interactives.forEach(el => {
          el.addEventListener('mouseenter', () => cursor.classList.add('cursor-active'));
          el.addEventListener('mouseleave', () => cursor.classList.remove('cursor-active'));
        });
      }

      function render() {
        cursorX += (mouseX - cursorX) * 0.35;
        cursorY += (mouseY - cursorY) * 0.35;
        cursor.style.transform = `translate3d(${cursorX}px, ${cursorY}px, 0) translate(-50%, -50%)`;
        requestAnimationFrame(render);
      }

      requestAnimationFrame(render);
      bindCursorHovers();
    })();
  </script>
</body>
</html>
