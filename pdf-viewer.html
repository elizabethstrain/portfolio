<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer — Harrison Design Brand Book</title>
  <style>
    :root {
      --bg-dark: #0D0D0D;
      --panel-dark: #161616;
      --border-dark: rgba(245, 242, 239, 0.12);
      --text-light: #F5F2EF;
      --text-muted: #8C827A;
      --gold: #C5A880;
      --gold-hover: #D8B98F;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
      color: var(--text-light);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Sub-header Toolbar */
    .viewer-toolbar {
      height: 48px;
      background: var(--panel-dark);
      border-bottom: 0.5px solid var(--border-dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      user-select: none;
      z-index: 10;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .doc-badge {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .doc-badge::before {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
    }

    .toolbar-center {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 0.5px solid rgba(255, 255, 255, 0.15);
      color: var(--text-light);
      font-size: 12px;
      font-weight: 400;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 150ms ease;
      line-height: 1;
    }

    .tool-btn:hover {
      background: rgba(197, 168, 128, 0.18);
      border-color: var(--gold);
      color: var(--gold);
    }

    .tool-btn:active {
      transform: scale(0.97);
    }

    .zoom-text {
      font-size: 11px;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      min-width: 44px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-link {
      background: transparent;
      border: 0.5px solid rgba(197, 168, 128, 0.4);
      color: var(--gold);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 100px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 150ms ease;
      line-height: 1.2;
    }

    .action-link:hover {
      background: var(--gold);
      color: #0D0D0D;
      border-color: var(--gold);
    }

    /* Scroll Area */
    .viewer-viewport {
      flex: 1;
      overflow-y: auto;
      overflow-x: auto;
      padding: 24px 16px 48px;
      position: relative;
      background: #080808;
      -webkit-overflow-scrolling: touch;
    }

    .canvas-container {
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06);
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 auto;
      transition: width 150ms ease, height 150ms ease;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Loading State */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 20;
      transition: opacity 250ms ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid rgba(197, 168, 128, 0.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* Custom Scrollbars */
    .viewer-viewport::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    .viewer-viewport::-webkit-scrollbar-track {
      background: #0D0D0D;
    }
    .viewer-viewport::-webkit-scrollbar-thumb {
      background: #2A2624;
      border-radius: 4px;
    }
    .viewer-viewport::-webkit-scrollbar-thumb:hover {
      background: var(--gold);
    }

    @media (max-width: 640px) {
      .viewer-toolbar {
        padding: 0 8px;
        height: 42px;
      }
      .doc-badge span {
        display: none;
      }
      .action-link span {
        display: none;
      }
      .viewer-viewport {
        padding: 12px 8px 36px;
      }
    }
  </style>
  <script src="js/pdf.min.js"></script>
</head>
<body>

  <!-- Minimalist Editorial PDF Toolbar -->
  <div class="viewer-toolbar" id="toolbar">
    <div class="toolbar-left">
      <div class="doc-badge" id="docBadge">
        <span>Actual PDF Document</span>
      </div>
    </div>

    <div class="toolbar-center">
      <button type="button" class="tool-btn" id="zoomOutBtn" title="Zoom Out" aria-label="Zoom Out">−</button>
      <span class="zoom-text" id="zoomLevelText">Fit</span>
      <button type="button" class="tool-btn" id="zoomInBtn" title="Zoom In" aria-label="Zoom In">+</button>
      <button type="button" class="tool-btn" id="fitWidthBtn" title="Fit to Screen Width">Fit Width</button>
      <button type="button" class="tool-btn" id="actualSizeBtn" title="Original Scale (100%)">100%</button>
    </div>

    <div class="toolbar-right">
      <a href="files/Harrison_Design_-_Brand_Board.pdf" download="Harrison_Design_Brand_Book.pdf" class="action-link" id="downloadBtn" title="Download the original PDF file">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Download PDF</span>
      </a>
      <a href="files/Harrison_Design_-_Brand_Board.pdf" target="_blank" rel="noopener noreferrer" class="action-link" id="openTabBtn" title="Open PDF in new window">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
        <span>Open</span>
      </a>
    </div>
  </div>

  <!-- PDF Display Viewport -->
  <div class="viewer-viewport" id="viewport">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text">Rendering Brand Book PDF...</div>
    </div>
    <div class="canvas-container" id="canvasContainer"></div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const pdfUrl = urlParams.get('file') || 'files/Harrison_Design_-_Brand_Board.pdf';

    // Update download and external links to match pdfUrl
    const downloadBtn = document.getElementById('downloadBtn');
    const openTabBtn = document.getElementById('openTabBtn');
    if (downloadBtn) downloadBtn.setAttribute('href', pdfUrl);
    if (openTabBtn) openTabBtn.setAttribute('href', pdfUrl);

    // Configure PDF.js Worker
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'js/pdf.worker.min.js';
    }

    let pdfDoc = null;
    let currentScale = 1.0;
    let isFitWidth = true;
    const canvasContainer = document.getElementById('canvasContainer');
    const viewport = document.getElementById('viewport');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const zoomText = document.getElementById('zoomLevelText');

    async function loadPDF() {
      try {
        const loadingTask = pdfjsLib.getDocument(pdfUrl);
        pdfDoc = await loadingTask.promise;
        renderAllPages();
      } catch (err) {
        console.error("PDF.js loading error:", err);
        // Fallback: Embed native PDF object
        canvasContainer.innerHTML = `
          <div style="padding: 40px 20px; text-align: center; color: #F5F2EF;">
            <p style="font-size: 16px; margin-bottom: 16px;">Unable to render PDF via canvas.</p>
            <a href="${pdfUrl}" target="_blank" style="color: #C5A880; text-decoration: underline; font-size: 14px;">Click here to view or download the original PDF directly.</a>
          </div>
        `;
        if (loadingOverlay) loadingOverlay.classList.add('hidden');
      }
    }

    async function renderAllPages() {
      if (!pdfDoc) return;
      canvasContainer.innerHTML = '';

      // Determine initial scale
      const page1 = await pdfDoc.getPage(1);
      const unscaledViewport = page1.getViewport({ scale: 1.0 });

      const viewportWidth = viewport.clientWidth - 48; // padding margin
      if (isFitWidth) {
        currentScale = Math.min(1.4, Math.max(0.3, viewportWidth / unscaledViewport.width));
        zoomText.textContent = Math.round(currentScale * 100) + '%';
      }

      // Render each page
      for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
        const page = await pdfDoc.getPage(pageNum);
        const pageViewport = page.getViewport({ scale: currentScale });

        const canvas = document.createElement('canvas');
        canvas.id = 'page-' + pageNum;
        const ctx = canvas.getContext('2d');

        // Crisp Retina rendering
        const outputScale = window.devicePixelRatio || 2;
        canvas.width = Math.floor(pageViewport.width * outputScale);
        canvas.height = Math.floor(pageViewport.height * outputScale);
        canvas.style.width = Math.floor(pageViewport.width) + 'px';
        canvas.style.height = Math.floor(pageViewport.height) + 'px';

        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

        const renderContext = {
          canvasContext: ctx,
          transform: transform,
          viewport: pageViewport
        };

        canvasContainer.appendChild(canvas);
        await page.render(renderContext).promise;
      }

      if (loadingOverlay) {
        loadingOverlay.classList.add('hidden');
      }
    }

    // Zoom Controls
    document.getElementById('zoomInBtn').addEventListener('click', () => {
      isFitWidth = false;
      currentScale = Math.min(currentScale + 0.15, 2.5);
      zoomText.textContent = Math.round(currentScale * 100) + '%';
      renderAllPages();
    });

    document.getElementById('zoomOutBtn').addEventListener('click', () => {
      isFitWidth = false;
      currentScale = Math.max(currentScale - 0.15, 0.25);
      zoomText.textContent = Math.round(currentScale * 100) + '%';
      renderAllPages();
    });

    document.getElementById('fitWidthBtn').addEventListener('click', () => {
      isFitWidth = true;
      renderAllPages();
    });

    document.getElementById('actualSizeBtn').addEventListener('click', () => {
      isFitWidth = false;
      currentScale = 1.0;
      zoomText.textContent = '100%';
      renderAllPages();
    });

    // Resize listener for auto-refit if fit-width active
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        if (isFitWidth) renderAllPages();
      }, 200);
    });

    // Kick off load
    loadPDF();
  </script>
</body>
</html>
